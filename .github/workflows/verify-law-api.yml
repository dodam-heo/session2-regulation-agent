name: Live government law API verification

on:
  push:
    paths:
      - 'scripts/verify-live-law-api.cjs'
      - 'scripts/verify-live-client.cjs'
      - 'src/law-drf.js'
      - '.github/workflows/verify-law-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-client:
    name: Native browser client and CORS verification (no Puter)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search, retrieve original clauses and verify browser GET CORS
        run: node scripts/verify-live-client.cjs

  raw-api:
    name: Raw official API diagnostic (independent)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search and retrieve raw official JSON
        run: node scripts/verify-live-law-api.cjs
