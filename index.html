<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
<script>
/** Non-destructive line-oriented Korean regulation parser.
 * Preserves original text as the source of truth; blocks are view/edit projections.
 */
const ARTICLE = /^(제\s*\d+\s*조(?:의\s*\d+)?)(?:\s*\(([^)]*)\))?\s*(.*)$/;
const CHAPTER = /^(제\s*\d+\s*(?:편|장|절|관))(?:\s*\(([^)]*)\))?\s*(.*)$/;
const ADDENDUM = /^부\s*칙(?:\s*\(([^)]*)\))?/;
const ANNEX = /^(\[(?:별표|별지)[^\]]*\])\s*(.*)$/;

const norm = (value='') => String(value).replace(/\s+/g,'').replace(/[（）]/g, c=>c==='（'?'(':')');
function isArticleHeading(line) { return ARTICLE.test(line.trim()); }
function parseRegulation(text='') {
  if(!String(text).trim()) return [];
  const lines=String(text).replace(/\r\n?/g,'\n').split('\n');
  const blocks=[];let current=null;let inAddendum=false;const seen=new Map();
  const startBlock=(kind,label,title,start,first)=>{
    if(current) blocks.push(current);
    const rawKey=`${kind}:${norm(label)}`;const count=(seen.get(rawKey)||0)+1;seen.set(rawKey,count);
    current={key:`${rawKey}#${count}`,kind,label,title:title||'',startLine:start+1,lines:[first],duplicate:count>1};
  };
  for(let i=0;i<lines.length;i++) {
    const line=lines[i],s=line.trim();let m;
    if((m=s.match(ARTICLE))) startBlock(inAddendum?'addendumArticle':'article',inAddendum?`부칙 ${m[1]}`:m[1],m[2]||'',i,line);
    else if((m=s.match(CHAPTER))) startBlock('chapter',m[1],m[2]||'',i,line);
    else if((m=s.match(ADDENDUM))) { inAddendum=true; startBlock('addendum','부칙',m[1]||'',i,line); }
    else if((m=s.match(ANNEX))) { inAddendum=false; startBlock('annex',m[1],'',i,line); }
    else if(!current) startBlock('intro','머리말','',i,line);
    else current.lines.push(line);
  }
  if(current) blocks.push(current);
  return blocks.map(b=>({...b, text:b.lines.join('\n'), paragraphCount:paragraphCount(b.lines.join('\n'))}));
}
function paragraphCount(text='') {
  const marks=String(text).match(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/g);
  return marks?.length ?? (text.trim()?1:0);
}
function replaceBlock(document, key, replacement) {
  const blocks=parseRegulation(document);const index=blocks.findIndex(b=>b.key===key);
  if(index<0) throw new Error('선택한 조문을 찾을 수 없습니다.');
  const text=String(replacement).replace(/\r\n?/g,'\n').trim();
  const expected=blocks[index];
  if(!text) throw new Error('조문을 비울 수 없습니다. 삭제 기능을 사용하세요.');
  if(['article','addendumArticle'].includes(expected.kind) && !isArticleHeading(text.split('\n')[0])) throw new Error('첫 줄은 제N조(제목) 형식이어야 합니다.');
  blocks[index]={...expected,text};
  return blocks.map(b=>b.text).join('\n');
}
function deleteBlock(document, key) {
  const blocks=parseRegulation(document);const next=blocks.filter(b=>b.key!==key);
  if(blocks.length===next.length) throw new Error('선택한 조문을 찾을 수 없습니다.');
  return next.map(b=>b.text).join('\n').replace(/^\n+|\n+$/g,'');
}
function appendArticle(document, heading='제1조의2(신설)', body='① 내용을 작성하세요.') {
  const target=`${heading} ${body}`;
  const blocks=parseRegulation(document); const stop=blocks.findIndex(b=>['addendum','addendumArticle','annex'].includes(b.kind));
  if(stop<0)return `${String(document).trimEnd()}\n${target}`.trim();
  blocks.splice(stop,0,{text:target});return blocks.map(b=>b.text).join('\n').trim();
}
function articleNumber(keyOrLabel) {
  const m=String(keyOrLabel).match(/제\s*(\d+)\s*조(?:의\s*(\d+))?/);
  return m ? [Number(m[1]),Number(m[2]||0)] : null;
}



// Myers-style text diff is not necessary for short clauses; capped LCS prevents accidental O(n*m) overload.
function tokens(text='') {return String(text).match(/\s+|[^\s]+/gu)||[];}
function diffTokens(a='',b='', limit=40000) {
  const left=tokens(a),right=tokens(b), n=left.length,m=right.length;
  if(a===b) return [{kind:'same',text:String(a)}];
  if(n*m>limit) return [{kind:'del',text:a},{kind:'add',text:b}];
  const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j]=left[i]===right[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];const push=(kind,text)=>{const last=out[out.length-1];if(last&&last.kind===kind)last.text+=text;else out.push({kind,text});};
  let i=0,j=0;
  while(i<n&&j<m) {
    if(left[i]===right[j]){push('same',left[i++]);j++;}
    else if(dp[i+1][j]>=dp[i][j+1])push('del',left[i++]);
    else push('add',right[j++]);
  }
  while(i<n) push('del',left[i++]);while(j<m)push('add',right[j++]);
  return out;
}
function kindStatus(oldBlock,newBlock){
  if(!oldBlock)return '신설';if(!newBlock)return '삭제';
  if(oldBlock.text===newBlock.text)return '유지';return '수정';
}
function compareRegulations(base='',draft='') {
  const before=parseRegulation(base),after=parseRegulation(draft);
  const aByKey=new Map(after.map(b=>[b.key,b]));
  const bByKey=new Map(before.map(b=>[b.key,b]));
  const keys=[...new Set([...before,...after].map(b=>b.key))];
  return keys.map(k=>{
    const oldBlock=bByKey.get(k)||null,newBlock=aByKey.get(k)||null;
    const oldText=oldBlock?.text||'',newText=newBlock?.text||'';
    return {id:k,label:newBlock?.label||oldBlock?.label||'기타', kind:newBlock?.kind||oldBlock?.kind,
      status:kindStatus(oldBlock,newBlock),oldText,newText,segments:diffTokens(oldText,newText)};
  });
}
function summarizeChanges(rows) {
  return rows.filter(r=>r.status!=='유지').map(r=>({label:r.label,status:r.status,excerpt:r.newText||r.oldText}));
}
function compileAmendment(title, rows, effectiveDate='', mode='amend') {
  const changed=rows.filter(r=>r.status!=='유지');
  if(!changed.length)return '변경 사항이 없습니다.';
  if(mode==='enact')return [`${title} 제정안 (검토용 초안)`,'※ 기존 조문이 없는 신규 제정안입니다. 신구조문대비표 작성 대상이 아닙니다.','',...changed.map(r=>r.newText).filter(Boolean), '',`시행일: ${effectiveDate||'미정(담당자 확인 필요)'}`].join('\n');
  const lines=[`${title} 일부개정안 (검토용 초안)`, '', '※ 아래는 조문별 변경 요약이며, 법제처 표준 개정지시문으로 검증되지 않았습니다.',''];
  for(const r of changed) {
    lines.push(`[${r.status}] ${r.label}`);
    if(r.oldText) lines.push(`현행: ${r.oldText}`);
    if(r.newText) lines.push(`개정안: ${r.newText}`);
    lines.push('');
  }
  lines.push(`시행일: ${effectiveDate||'미정(담당자 확인 필요)'}`);
  return lines.join('\n');
}




const REFERENCE=/제\s*\d+\s*조(?:의\s*\d+)?(?:\s*제\s*\d+\s*항)?/g;
const PARAGRAPH=/(?:제\s*(\d+)\s*항)/;
const ART=/^(제\s*\d+\s*조(?:의\s*\d+)?)/;
const CIRCLED='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function clauses(text){
  return String(text).split(/(?=[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳])/g)
    .map(x=>x.trim()).filter(x=>CIRCLED.includes(x[0]))
    .map(x=>({number:CIRCLED.indexOf(x[0])+1,body:x.slice(1).replace(/\s+/g,'').trim()}));
}
function movedParagraphs(base='',draft=''){
  const oldMap=new Map(parseRegulation(base).filter(a=>a.kind==='article').map(a=>[norm(a.label),a]));
  const out=new Map();
  for(const art of parseRegulation(draft).filter(a=>a.kind==='article')){
    const orig=oldMap.get(norm(art.label));if(!orig)continue;
    const originalClauses=clauses(orig.text),currentClauses=clauses(art.text);
    for(const before of originalClauses){
      const after=currentClauses.find(c=>c.body===before.body&&c.body.length>=5);
      if(after&&after.number!==before.number)out.set(`${norm(art.label)}#${before.number}`,{old:before.number,new:after.number,article:art.label});
    }
  }
  return out;
}
function externalContext(text,pos){
  const prev=text.slice(Math.max(0,pos-50),pos);
  // 「...법」 제5조 / 「...규정」 제7조 are external citations until explicitly attached to selected local text.
  return /「[^」]+」\s*$/.test(prev)||/(?:다른\s*법률|상위\s*법령|외부\s*규정)\s*$/.test(prev);
}
function referencesIn(text='') {
  return [...String(text).matchAll(REFERENCE)].map(m=>({value:m[0],index:m.index,article:norm(m[0].match(ART)?.[1]||''),paragraph:m[0].match(PARAGRAPH)?.[1]||null,external:externalContext(text,m.index)}));
}
function scanRegulation(base='',draft='',opts={}) {
  const articles=parseRegulation(draft).filter(b=>b.kind==='article');
  const all=parseRegulation(draft),available=new Map(),items=[];let k=0;
  const moved=movedParagraphs(base,draft);
  const emit=(severity,category,location,message,evidence,check='자동검사')=>items.push({id:`ISS-${++k}`,severity,category,location,message,evidence,check});
  for(const a of articles) {
    const label=norm(a.label);
    if(available.has(label))emit('error','조문 구조',a.label,`동일한 조문번호가 중복되었습니다: ${a.label}`,`위치: ${available.get(label).startLine}행, ${a.startLine}행`);
    else available.set(label,a);
  }
  for(const a of all) {
    for(const ref of referencesIn(a.text)) {
      if(ref.external)continue;
      const target=available.get(ref.article);
      if(!target){
        // This is an ambiguity, not proof of an invalid reference: a law title may be omitted.
        emit('review','인용 확인',a.label,`${ref.value}의 인용 대상이 현재 규정 안에서 확인되지 않습니다. 외부 법령 인용 여부를 확인하세요.`,a.text.slice(Math.max(0,ref.index-16),ref.index+ref.value.length+25));
        continue;
      }
      if(ref.paragraph && norm(a.label)!==ref.article){
        const oldMove=moved.get(`${ref.article}#${ref.paragraph}`);
        if(oldMove)emit('review','항 이동 인용',a.label,`${oldMove.article}의 기존 제${oldMove.old}항 문구가 현재 제${oldMove.new}항으로 이동했습니다. 이 인용이 새 항을 의도한 것인지 확인하세요.`,a.text.slice(Math.max(0,ref.index-18),ref.index+ref.value.length+30));
      }
      if(ref.paragraph) {
        const markers=[...target.text.matchAll(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/g)];
        const p=Number(ref.paragraph);
        if(markers.length&&p>markers.length)emit('error','항 인용',a.label,`${ref.value}: 대상 조문의 제${p}항이 확인되지 않습니다.`,target.text.slice(0,180));
      }
    }
  }
  if(!draft.trim())emit('error','자료 부족','초안','검토할 규정 본문이 없습니다.','규정 원문/초안 입력 필요');
  if(opts.mode==='amend'&&!base.trim())emit('review','판본 확인','현행 원문','현행 판본이 없어 신구 비교의 기준을 확정할 수 없습니다.','원문 또는 공식 판본 추가 필요','검사범위');
  if(opts.effectiveDate!==undefined&&!opts.effectiveDate.trim())emit('review','부칙·시행','시행일','시행일이 미정입니다. 발령·적용 시점을 확인하세요.','담당자 결정 필요','업무 점검');
  const changes=compareRegulations(base,draft).filter(r=>r.status!=='유지');
  if(opts.reason&&changes.length) {
    const allOld=new Set((base.match(/\d[\d,.]*\s*(?:일|원|년|개월|명|%)/g)||[]).map(x=>x.trim()));
    const allNew=new Set((draft.match(/\d[\d,.]*\s*(?:일|원|년|개월|명|%)/g)||[]).map(x=>x.trim()));
    for(const old of allOld) if(!allNew.has(old)&&opts.reason.includes(old)) {
      emit('review','이유서 정합성','개정 이유',`개정 전 수치(${old})가 개정 이유에 남아 있습니다.`,opts.reason.slice(0,160));
    }
  }
  return {items,version:opts.version||0,checkedAt:new Date().toISOString(),checks:['내부 조문번호 중복','같은 조문 내 항 번호 이동에 따른 인용 후보','현재 텍스트 내 인용 및 항 번호','시행일 입력','수치 변경·이유서 표시'],notChecked:['공식 원문·판본 실재 여부','외부 법령의 위임 범위·개정 효력','기관별 절차의 법적 충족','법제 표준문구 적합성']};
}
function relatedClauses(text='',label=''){
  const n=norm(label);return parseRegulation(text).filter(b=>b.kind==='article'&&norm(b.label)!==n&&referencesIn(b.text).some(r=>r.article===n&&!r.external)).map(b=>({label:b.label,text:b.text}));

function overviewView(work){const counts=compareRegulations(work.baseText,work.draftText),num=counts.filter(x=>x.status!=='유지').length;const review=work.review?.version===work.draftVersion?work.review:null;return `<div class="grid-overview"><section class="panel wide">${sectionTop('작업 현황','한 번 등록한 자료와 초안을 모든 기능에서 공유합니다.')}<div class="stats"><div><b>${work.sources.length}</b><span>등록 근거</span></div><div><b>${work.draftVersion}</b><span>초안 버전</span></div><div><b>${num}</b><span>변경 조문</span></div><div><b>${review?review.items.length:'—'}</b><span>최근 점검 항목</span></div></div><div class="summary-grid"><div class="summary-block"><span class="minor-label">업무 목적</span><form id="objectiveForm"><textarea name="objective" rows="3" placeholder="이번 제·개정의 목적">${e(work.objective)}</textarea><button class="btn btn-minor" type="submit">내용 저장</button></form></div><div class="summary-block"><span class="minor-label">지금 할 수 있는 작업</span><div class="next-actions"><button data-action="tab" data-tab="sources">근거와 판본 등록 <span>→</span></button><button data-action="tab" data-tab="draft">조문 초안 편집 <span>→</span></button><button data-action="tab" data-tab="review">인용·정합성 확인 <span>→</span></button><button data-action="tab" data-tab="documents">문서 세트 내보내기 <span>→</span></button></div></div></div></section><section class="panel ai-panel">${sectionTop('AI 초안 작성 보조','모델에 종속되지 않는 별도 서버에 연결할 수 있습니다.')}<div class="privacy-note"><strong>원문은 자동 전송되지 않습니다.</strong> AI 요청 버튼을 누르고 전송 동의한 경우에만 연결된 서버로 전달됩니다.</div><form id="aiForm"><label>요청 내용<textarea name="instruction" rows="4" placeholder="예: 제3조의 문구를 명확하게 수정하고 근거가 부족한 부분은 별도로 표시해줘">${e(work.objective)}</textarea></label><label class="consent"><input type="checkbox" name="consent" required /> 현재 작업 원문을 구성된 AI 서버로 전송하는 데 동의합니다.</label><button class="btn btn-primary full" ${aiWorking?'disabled':''} type="submit">${aiWorking?'AI 제안 생성 중…':'AI 초안 제안 요청 →'}</button></form><div class="hint">GitHub Pages 미연결 상태에서는 AI 기능을 실행할 수 없습니다. 수동 편집·검토 기능과 구별됩니다.</div>${aiMessage?`<div class="message">${e(aiMessage)}</div>`:''}${work.aiSuggestion?`<div class="proposal"><strong>AI 제안 · 적용 전 검토</strong><pre>${e(work.aiSuggestion.proposalText||'내용 없음')}</pre>${work.aiSuggestion.reason?`<p>${e(work.aiSuggestion.reason)}</p>`:''}<div class="button-row"><button class="btn btn-primary" data-action="apply-ai">이 제안으로 초안 교체</button><button class="btn btn-minor" data-action="reject-ai">제안 닫기</button></div></div>`:''}</section><section class="panel activity-panel">${sectionTop('최근 변경 이력','초안 변경 시 비교·검토는 최신 자료에서 다시 계산합니다.')}<div class="activity-list">${[...work.history].reverse().slice(0,9).map(x=>`<div><span class="history-dot"></span><span><strong>${e(x.what)}</strong><small>${formatDate(x.at)}</small></span></div>`).join('')}</div></section></div>`;}
function sourceView(work){return `<div class="two-column"><div><section class="panel">${sectionTop('근거·자료 목록','공식 판본 확인 여부와 사용자 제공 자료를 구분합니다.')}<div class="source-tabs">${chip('공식 법령 / 행정규칙')}${chip('유사 규정')}${chip('기관 내부자료')}</div>${work.sources.length?work.sources.map(s=>`<div class="source-card"><div><strong>${e(s.title)}</strong><div class="source-meta">${chip(s.kind)} ${chip(s.status,s.status==='공식 원문 확인'?'green':'amber')} ${s.private?chip('내부자료'):''}</div></div>${s.url?`<a href="${e(s.url)}" target="_blank" rel="noopener noreferrer">원문 링크 ↗</a>`:''}<p>${e(s.excerpt||'원문 발췌 미입력')}</p><button class="text-link danger" data-action="remove-source" data-id="${e(s.id)}">목록에서 제거</button></div>`).join(''):`<div class="empty">등록된 근거가 없습니다. 공식 출처에서 확인한 자료 또는 내부 자료를 추가하세요.</div>`}</section><section class="panel source-form">${sectionTop('자료 등록','검색되지 않은 법령이나 근거를 임의로 만들어 넣지 않습니다.')}<form id="sourceForm"><div class="form-two"><label>자료명<input name="title" required placeholder="법령·행정규칙·내부 문서명" /></label><label>자료 종류<select name="kind"><option>공식 법령</option><option>행정규칙</option><option>자치법규</option><option>유사 규정</option><option>내부자료</option><option>기타</option></select></label></div><div class="form-two"><label>근거 URL (선택)<input name="url" type="url" placeholder="https://..." /></label><label>확인 상태<select name="status"><option>사용자 제공·미검증</option><option>공식 원문 확인</option><option>출처 재확인 필요</option></select></label></div><label>관련 조문·자료 발췌<textarea name="excerpt" rows="3" placeholder="실제 원문의 해당 문구 또는 메모"></textarea></label><label class="consent"><input name="private" type="checkbox" /> 비공개·내부 자료로 분류</label><button class="btn btn-primary" type="submit">+ 근거 카드 추가</button></form></section></div><aside><section class="panel help-card">${sectionTop('공식 자료 확인 경로','외부 검색은 새 창으로 열립니다. 결과는 자동 수집되지 않습니다.')}<div class="external-list"><a href="https://www.law.go.kr/" target="_blank" rel="noopener noreferrer">국가법령정보센터 <span>↗</span></a><a href="https://www.elis.go.kr/" target="_blank" rel="noopener noreferrer">자치법규정보시스템 <span>↗</span></a><a href="https://www.moleg.go.kr/" target="_blank" rel="noopener noreferrer">법제처 <span>↗</span></a></div><div class="privacy-note"><strong>출처 확인 원칙</strong><p>원문 링크가 있다고 내용이 자동 검증된 것은 아닙니다. 판본·발령·시행일과 위임 여부는 각각 확인해야 합니다.</p></div></section><section class="panel">${sectionTop('현행 판본 관리','판본 변경 시 비교·점검 기록을 무효화합니다.')}<form id="baseForm"><label>현행판본 식별자<input name="baseVersion" value="${e(work.baseVersion)}" placeholder="발령일·판본번호" /></label><label>현행 원문<textarea name="baseText" rows="13" placeholder="현행 규정 원문을 붙여넣으세요">${e(work.baseText)}</textarea></label><label class="file-label">텍스트 파일 가져오기 (.txt/.md)<input type="file" accept=".txt,.md,text/plain,text/markdown" data-file-target="baseText" /></label><button class="btn btn-primary full" type="submit">현행판본 저장</button></form></section></aside></div>`;}
function draftView(work){const blocks=parseRegulation(work.draftText),selected=blocks.find(x=>x.key===work.selectedKey)||blocks.find(x=>x.kind==='article')||blocks[0];const attached=selected?relatedClauses(work.draftText,selected.label):[];return `<div class="editor-grid"><section class="panel document-tree"><div class="panel-head"><div><h2>조문 구성</h2><p>${blocks.length}개 구조 블록</p></div><button class="tiny-button" data-action="add-article">+ 조문</button></div><div class="tree-list">${blocks.length?blocks.map(b=>`<button class="tree-item ${b.key===selected?.key?'active':''}" data-action="select-article" data-key="${e(b.key)}"><span>${b.kind==='article'?'§':b.kind==='annex'?'▤':b.kind==='addendum'?'◆':'—'}</span><span><strong>${e(b.label)}</strong><small>${e(b.title||({chapter:'장·절',addendum:'부칙',annex:'별표·서식',intro:'머리말'})[b.kind]||'')}</small></span></button>`).join(''):`<div class="empty">등록된 초안이 없습니다.</div>`}</div><button class="btn btn-minor full" data-action="new-template">기본 조문 틀 만들기</button></section><section class="panel main-editor">${sectionTop('조문 편집','규정 원문과 작성 초안은 별도로 보존합니다. 편집 시 버전이 증가합니다.',chip(`DRAFT-${String(work.draftVersion).padStart(3,'0')}`,'blue'))}${selected?`<div class="editor-caption"><strong>${e(selected.label)} ${selected.title?`(${e(selected.title)})`:''}</strong><span>${chip(selected.kind==='article'?'조문':'문서 구조')}</span></div><form id="articleForm"><input type="hidden" name="key" value="${e(selected.key)}" /><textarea name="text" rows="18" spellcheck="false" aria-label="선택 조문 편집">${e(selected.text)}</textarea><div class="editor-actions"><button class="btn btn-primary" type="submit">수정 내용 저장</button><button class="btn btn-minor" type="button" data-action="tab" data-tab="compare">신구 비교 보기 →</button><button class="btn btn-ghost danger" type="button" data-action="delete-article" data-key="${e(selected.key)}">이 블록 삭제</button></div></form>`:`<div class="empty">규정 내용을 먼저 입력하거나 기본 조문 틀을 만드세요.</div><form id="wholeDraftForm"><textarea name="draftText" rows="12" placeholder="제1조(목적) ..."></textarea><button class="btn btn-primary" type="submit">초안 저장</button></form>`}<p class="form-help">조문 제목·내용을 포함해 편집할 수 있습니다. 한 조문에 대한 변경은 다른 조문으로 자동 확산되지 않습니다.</p></section><aside class="editor-context"><section class="panel context-panel">${sectionTop('조문 맥락','관련 조항·근거·확인사항을 함께 봅니다.')}<h3>연관 조항</h3>${selected&&attached.length?attached.map(a=>`<button class="context-link" data-action="jump-article" data-label="${e(a.label)}"><strong>${e(a.label)}</strong><span>${e(a.text.slice(0,80))}…</span></button>`).join(''):`<p class="muted">현재 본문에서 이 조문을 직접 인용한 다른 조항이 확인되지 않았습니다.</p>`}<h3>등록 근거</h3>${work.sources.length?work.sources.slice(0,4).map(s=>`<div class="context-source"><strong>${e(s.title)}</strong><small>${e(s.status)}</small></div>`).join(''):`<p class="muted">근거가 등록되지 않았습니다.</p>`}<button class="btn btn-minor full" data-action="tab" data-tab="sources">근거 추가 →</button></section></aside></div>`;}
function markupDiff(segments,side){return segments.filter(s=>s.kind==='same'||s.kind===(side==='old'?'del':'add')).map(s=>s.kind==='same'?e(s.text):`<mark class="${side==='old'?'old-mark':'new-mark'}">${e(s.text)}</mark>`).join('');}
function compareView(work){const rows=compareRegulations(work.baseText,work.draftText);const shown=filter==='changed'?rows.filter(r=>r.status!=='유지'):rows;return `<section class="panel">${sectionTop('신·구조문 대비','현행 원문과 초안의 실제 문구 차이를 표시합니다. 변경 부분만 강조합니다.',`<div class="button-row"><button class="btn ${filter==='all'?'btn-primary':'btn-minor'}" data-action="filter" data-filter="all">전체 ${rows.length}</button><button class="btn ${filter==='changed'?'btn-primary':'btn-minor'}" data-action="filter" data-filter="changed">변경 ${rows.filter(r=>r.status!=='유지').length}</button></div>`)}<div class="comparison-note">${chip(`현행 ${work.baseVersion}`)} <span>→</span> ${chip(`초안 v${work.draftVersion}`,'blue')} <span class="quiet">동일 문서 번호에 대한 기계적 대응입니다. 조문 이동·분할은 담당자 확인이 필요합니다.</span></div>${work.baseText.trim()?`<div class="compare-table-wrap"><table class="compare-table"><thead><tr><th>조문·유형</th><th>현행 원문</th><th>개정안</th></tr></thead><tbody>${shown.map(r=>`<tr><th><span class="row-label">${e(r.label)}</span>${chip(r.status,r.status==='수정'?'blue':r.status==='신설'?'green':r.status==='삭제'?'rose':'')}</th><td>${r.oldText?markupDiff(r.segments,'old'):'<em class="missing">&lt;해당 조문 없음&gt;</em>'}</td><td>${r.newText?markupDiff(r.segments,'new'):'<em class="missing">&lt;해당 조문 없음&gt;</em>'}</td></tr>`).join('')||`<tr><td colspan="3" class="empty">표시할 조문이 없습니다.</td></tr>`}</tbody></table></div>`:`<div class="empty">현행판본이 없어 아직 비교할 수 없습니다. 현행판본을 먼저 등록하세요.<p><button class="btn btn-minor" data-action="tab" data-tab="sources">현행 원문 등록 →</button></p></div>`}</section><section class="panel doc-note"><h3>일부개정문 작성 참고자료</h3><p>기계적 변경 요약입니다. 자동으로 법제 표준 개정지시문이라고 확정하지 않습니다.</p><pre>${e(compileAmendment(work.title,rows,work.effectiveDate,work.type==='enact'?'enact':'amend'))}</pre><button class="btn btn-minor" data-action="copy-amend">내용 복사</button></section>`;}
function reviewView(work){const active=work.review?.version===work.draftVersion?work.review:null,changes=compareRegulations(work.baseText,work.draftText).filter(r=>r.status!=='유지'&&r.kind==='article');const links=changes.flatMap(c=>relatedClauses(work.draftText,c.label).map(a=>({changed:c.label,...a})));const uniq=[...new Map(links.map(x=>[`${x.changed}-${x.label}`,x])).values()];return `<div class="two-column review-grid"><div><section class="panel">${sectionTop('오류·정합성 검토','검출 규칙과 미검증 사항을 분리해 보여줍니다.',`<button class="btn btn-primary" data-action="scan">현재 초안 검사 실행</button>`)}${!active?`<div class="notice amber-notice">현재 초안에 대한 자동 점검 기록이 없습니다. 조문을 수정했다면 다시 실행해야 합니다.</div>`:`<div class="notice good-notice">초안 v${active.version} 검사 기록 · ${formatDate(active.checkedAt)} · ${active.items.length}개 확인 항목</div>`}${active?`<div class="issue-list">${active.items.length?active.items.map(i=>`<div class="issue"><div class="issue-head">${chip(i.severity==='error'?'오류':i.severity==='review'?'확인 필요':'정보',i.severity==='error'?'rose':'amber')}<strong>${e(i.location)} · ${e(i.category)}</strong></div><p>${e(i.message)}</p><small>${e(i.evidence)}</small></div>`).join(''):`<div class="empty">현재 구현된 자동검사 범위에서 문제 항목이 검출되지 않았습니다. 법적 적합성 확인을 뜻하지 않습니다.</div>`}</div><div class="check-scope"><strong>자동 확인 범위</strong><p>${e(active.checks.join(' · '))}</p><strong>별도 확인 필요</strong><ul>${active.notChecked.map(x=>`<li>${e(x)}</li>`).join('')}</ul></div>`:''}</section><section class="panel">${sectionTop('변경 조문의 연관 인용','변경된 조문을 참조하는 다른 조항을 후보로 표시합니다.')} ${uniq.length?uniq.map(x=>`<div class="impact-row"><div>${chip(x.changed,'blue')} 변경에 연관된 ${chip(x.label)}<p>${e(x.text.slice(0,230))}</p></div><button class="btn btn-minor" data-action="jump-article" data-label="${e(x.label)}">조문 보기 →</button></div>`).join(''):`<div class="empty">현재 규정 본문에서 직접 인용된 연관 조항 후보가 없습니다.</div>`}<p class="hint">조문 내용을 바꾸어도 다른 인용 조항이 자동 정정되지는 않습니다. 법적·업무상 영향은 담당자가 판단합니다.</p></section></div><aside><section class="panel">${sectionTop('변경 범위',`${changes.length}개 조문이 변경 후보로 식별되었습니다.`)}${changes.length?changes.map(c=>`<div class="change-summary">${chip(c.status,c.status==='신설'?'green':'blue')}<span>${e(c.label)}</span></div>`).join(''):`<div class="empty small-empty">변경 조문 없음</div>`}</section><section class="panel help-card">${sectionTop('검토의 경계','자동검사 완료 ≠ 법적 적합성 확정')}<p class="muted">본 도구의 기본 검사에서는 조문 구조, 내부 인용, 숫자 잔존 등을 확인합니다. 외부 법령과 기관 절차의 유효성은 연결된 공식 자료와 담당자 확인이 필요합니다.</p><button class="btn btn-minor full" data-action="tab" data-tab="sources">근거 확인하기 →</button></section></aside></div>`;}
function documentView(work){return `<div class="two-column"><div><section class="panel">${sectionTop('제·개정 문서 작성','같은 초안 버전의 원문·대비·근거를 기반으로 결과물을 만듭니다.')}<form id="documentsForm"><label>제·개정 이유<textarea name="reason" rows="4" placeholder="변경 필요성과 주요 내용을 작성하세요">${e(work.reason)}</textarea></label><div class="form-two"><label>시행일·부칙 문구<input name="effectiveDate" placeholder="예: 발령한 날부터 시행한다" value="${e(work.effectiveDate)}" /></label><label>규정 유형<select name="regulationType">${['미정','내부 지침','행정규칙','자치법규','기타'].map(x=>`<option ${work.regulationType===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label>경과조치·추가 검토사항<textarea name="transition" rows="3" placeholder="예: 종전 신청 건은 종전 규정을 적용할지 확인">${e(work.transition)}</textarea></label><button class="btn btn-primary" type="submit">문서 입력사항 저장</button></form></section><section class="panel">${sectionTop('연결된 결과물 내보내기','최신 초안에서 즉시 생성하며, 저장된 자동검토 여부를 표시합니다.')}<div class="export-grid"><button data-action="download-html"><b>▤</b><strong>보고서형 HTML</strong><small>신구 대비표 포함 · 인쇄 가능</small></button><button data-action="download-txt"><b>≡</b><strong>텍스트 묶음</strong><small>초안·이유·부칙·검토</small></button><button data-action="download-json"><b>{ }</b><strong>작업 JSON</strong><small>근거·판본·작업 이력 백업</small></button></div><p class="hint">HWPX·DOCX 원본 변환이나 기관 결재 상신을 완료했다고 표시하지 않습니다. 출력 문서는 검토용 초안입니다.</p></section></div><aside><section class="panel">${sectionTop('업무 절차 체크리스트','기관별 규칙이 미등록된 상태의 참고 절차입니다. 실제 이행 여부는 담당자가 기록합니다.')}<div class="procedure">${PROCEDURE.map((p,i)=>`<label><input type="checkbox" data-action="stage" data-stage="${i}" ${work.taskStates[i]?'checked':''}/><span><b>${String(i+1).padStart(2,'0')}</b>${e(p)}</span></label>`).join('')}</div><div class="privacy-note"><strong>기관별 절차 확인 필요</strong><p>규정 유형과 기관의 위임·의견수렴·결재 요건에 따라 달라질 수 있습니다.</p></div></section><section class="panel">${sectionTop('현재 초안 정보','모든 출력에 표시되는 공통 판본 정보')}<dl class="meta-list"><dt>현행 판본</dt><dd>${e(work.baseVersion)}</dd><dt>초안 버전</dt><dd>DRAFT-${String(work.draftVersion).padStart(3,'0')}</dd><dt>등록 근거</dt><dd>${work.sources.length}건</dd><dt>자동검토</dt><dd>${work.review?.version===work.draftVersion?'현재 판본 검사 기록 있음':'현재 판본 미검사'}</dd></dl></section></aside></div>`;}
function renderModal(){const type=modal.type||'amend';return `<div class="modal-backdrop" data-action="close-modal"><div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div>${stamp('NEW WORK CASE')}<h2 id="modal-title">새 규정 업무 시작</h2><p>목적만 있어도 시작할 수 있습니다. 부족한 자료는 작업 중에 보완하세요.</p></div><button class="icon-button" data-action="close-modal" aria-label="닫기">✕</button></div><form id="newForm"><div class="form-two"><label>업무 유형<select name="type">${Object.entries(WORK_TYPES).map(([k,v])=>`<option value="${k}" ${k===type?'selected':''}>${e(v)}</option>`).join('')}</select></label><label>규정 종류<select name="regulationType"><option>미정</option><option>내부 지침</option><option>행정규칙</option><option>자치법규</option><option>기타</option></select></label></div><label>대상 규정명<input name="title" placeholder="예: 정보관리 지침" /></label><label>업무 목적·요청 내용<textarea name="objective" rows="3" placeholder="무슨 이유로 무엇을 제정·개정·검토하나요?">${e(modal.intent||'')}</textarea></label><label>현행 규정 원문 <span class="optional">선택 · 붙여넣기 또는 파일</span><textarea name="baseText" rows="6" placeholder="제1조(목적) ..."></textarea></label><label class="file-label">현행 텍스트 가져오기 (.txt/.md)<input type="file" accept=".txt,.md,text/plain,text/markdown" data-file-target="baseText" /></label><div class="modal-foot"><p>처음에는 이 브라우저에만 저장됩니다. 입력되지 않은 법적 근거는 만들어 넣지 않습니다.</p><button class="btn btn-primary" type="submit">작업공간 만들기 →</button></div></form></div></div>`;}
function toTab(id){tab=id;filter='all';render();window.scrollTo({top:0,behavior:'instant'});}
function nextArtNumber(text){const used=parseRegulation(text).filter(b=>b.kind==='article').map(b=>Number(b.label.match(/제\s*(\d+)/)?.[1]||0));return Math.max(0,...used)+1;}
function download(filename,data,mime){const blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const safeName=name=>String(name).replace(/[\\/<>:"|?*]+/g,'_').slice(0,80)||'규정';
async function copyText(str){try{await navigator.clipboard.writeText(str);notify('클립보드에 복사했습니다.');}catch{notify('복사 권한을 확인해 주세요.');}}
function addDemo(){const n=newCase('amend',DEMO);activeId=n.id;tab='overview';modal=null;setWork(n);notify('가상 예시 작업을 열었습니다. 공식 법령 검증 사례가 아닙니다.');}
root.addEventListener('click',event=>{
  const b=event.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;
  if(act==='close-modal'&&event.target!==b&&b.classList.contains('modal-backdrop'))return;
  if(act==='home'||act==='recent'){activeId=null;modal=null;render();if(act==='recent')document.querySelector('.lower-grid')?.scrollIntoView({behavior:'smooth'});return;}
  if(act==='new'){modal={type:b.dataset.type||'amend',intent:''};render();return;}
  if(act==='demo'){addDemo();return;}
  if(act==='close-modal'){modal=null;render();return;}
  if(act==='open-case'){activeId=b.dataset.id;tab='overview';render();return;}
  if(act==='tab'){toTab(b.dataset.tab);return;}
  const work=w();if(!work)return;
  if(act==='select-article'){setWork({...work,selectedKey:b.dataset.key});return;}
  if(act==='jump-article'){const match=parseRegulation(work.draftText).find(x=>norm(x.label)===norm(b.dataset.label));tab='draft';setWork({...work,selectedKey:match?.key||''});return;}
  if(act==='add-article'){const n=nextArtNumber(work.draftText),text=appendArticle(work.draftText,`제${n}조(신설 조문)`,'① 내용을 작성하세요.');const next=updateDraft(work,text,`제${n}조 신설`);next.selectedKey=parseRegulation(text).at(-1)?.key||'';setWork(next);notify('신설 조문이 추가되었습니다.');return;}
  if(act==='new-template'){if(work.draftText.trim()&&!confirm('현재 초안을 제정용 기본 틀로 덮어쓸까요?'))return;const text='제1조(목적) [제정 목적을 작성하십시오.]\n제2조(정의) [주요 용어를 정의하십시오.]\n제3조(적용범위) [적용 대상을 작성하십시오.]\n제4조(운영사항) [수행 절차와 권한을 작성하십시오.]\n부칙\n제1조(시행일) [시행일을 확정하십시오.]';const next=updateDraft(work,text,'제정안 빈 구조 생성');next.selectedKey='article:제1조#1';setWork(next);notify('편집 가능한 빈 조문 체계를 만들었습니다.');return;}
  if(act==='delete-article'){if(!confirm('이 블록을 초안에서 삭제할까요? 현행 원문은 유지됩니다.'))return;try{const next=updateDraft(work,deleteBlock(work.draftText,b.dataset.key),'조문/블록 삭제');next.selectedKey='';setWork(next);}catch(err){notify(err.message);}return;}
  if(act==='scan'){const review=scanRegulation(work.baseText,work.draftText,{version:work.draftVersion,mode:work.type,effectiveDate:work.effectiveDate,reason:work.reason});editWork({review},`초안 v${work.draftVersion} 규칙 검사 실행`);notify(`자동 점검 ${review.items.length}건을 표시했습니다.`);return;}
  if(act==='filter'){filter=b.dataset.filter;render();return;}
  if(act==='remove-source'){if(!confirm('등록한 근거 카드를 제거할까요?'))return;editWork({sources:work.sources.filter(x=>x.id!==b.dataset.id)},'근거 제거');return;}
  if(act==='stage'){return;}
  if(act==='copy-amend'){copyText(compileAmendment(work.title,compareRegulations(work.baseText,work.draftText),work.effectiveDate,work.type==='enact'?'enact':'amend'));return;}
  if(act==='download-json'){download(`${safeName(work.title)}_작업백업.json`,JSON.stringify(work,null,2),'application/json');return;}
  if(act==='download-txt'){download(`${safeName(work.title)}_문서묶음.txt`,bundleText(work),'text/plain;charset=utf-8');return;}
  if(act==='download-html'){download(`${safeName(work.title)}_보고서.html`,bundleHtml(work),'text/html;charset=utf-8');return;}
  if(act==='apply-ai'){if(!work.aiSuggestion?.proposalText)return;if(!confirm('AI 제안으로 현재 초안을 교체할까요? 현행 원문은 유지됩니다.'))return;const next=updateDraft(work,work.aiSuggestion.proposalText,'AI 제안 승인 적용');if(work.aiSuggestion.reason)next.reason=work.aiSuggestion.reason;setWork(next);toTab('draft');return;}
  if(act==='reject-ai'){editWork({aiSuggestion:null},'AI 제안 닫기');return;}
});
// Modal lives outside #app, so clicks within it are delegated to document.
document.addEventListener('click',event=>{if(!event.target.closest('.modal-backdrop'))return;const b=event.target.closest('[data-action="close-modal"]');if(!b)return;if(b.classList.contains('modal-backdrop')&&event.target!==b)return;modal=null;render();});
document.addEventListener('change',async ev=>{
  const input=ev.target;if(input.matches('input[type="file"][data-file-target]')){
    const file=input.files?.[0];if(!file)return;if(file.size>2_000_000){notify('텍스트 파일은 2MB 이하만 지원합니다.');return;}
    const target=input.closest('form')?.querySelector(`[name="${input.dataset.fileTarget}"]`);
    if(target){target.value=await file.text();notify('텍스트 원문을 불러왔습니다. 저장 버튼을 눌러 확정하세요.');}
  }
  if(input.matches('[data-action="stage"]')){const work=w();if(!work)return;const taskStates={...work.taskStates,[input.dataset.stage]:input.checked};editWork({taskStates},'절차 체크리스트 변경');}
});
document.addEventListener('submit',async event=>{
  const form=event.target;if(!form.id)return;event.preventDefault();const d=new FormData(form),val=k=>String(d.get(k)||'').trim();
  if(form.id==='quickForm'){modal={type:'amend',intent:val('intent')};render();return;}
  if(form.id==='newForm'){const type=val('type');const baseText=val('baseText');const n=newCase(type,{title:val('title')||'제목 미정 규정',regulationType:val('regulationType'),objective:val('objective'),baseText,draftText:baseText});activeId=n.id;tab=['compare'].includes(type)?'compare':['review','impact'].includes(type)?'review':type==='research'?'sources':type==='documents'?'documents':'overview';modal=null;setWork(n);notify('작업공간이 생성되었습니다.');return;}
  const work=w();if(!work)return;
  if(form.id==='objectiveForm'){editWork({objective:val('objective')},'업무 목적 수정');notify('업무 목적을 저장했습니다.');return;}
  if(form.id==='baseForm'){const next=changeBase(work,val('baseText'),val('baseVersion'));setWork(next);notify('현행판본을 저장했습니다. 이전 검토 기록은 무효화했습니다.');return;}
  if(form.id==='sourceForm'){let url=val('url');if(url&&!/^https?:\/\//i.test(url)){notify('https 또는 http 주소만 등록할 수 있습니다.');return;}const source={id:globalThis.crypto?.randomUUID?.()||`s-${Date.now()}`,title:val('title'),kind:val('kind'),url,status:val('status'),excerpt:val('excerpt'),private:d.has('private')};editWork({sources:[...work.sources,source]},`근거 추가: ${source.title}`);notify('근거 카드가 추가되었습니다.');return;}
  if(form.id==='articleForm'){try{const nextText=replaceBlock(work.draftText,val('key'),val('text'));const next=updateDraft(work,nextText,'조문 수정');next.selectedKey=val('key');setWork(next);notify(`초안 v${next.draftVersion} 저장 · 비교 갱신`);}catch(err){notify(err.message);}return;}
  if(form.id==='wholeDraftForm'){setWork(updateDraft(work,val('draftText'),'초안 작성'));notify('초안 저장 완료');return;}
  if(form.id==='documentsForm'){editWork({reason:val('reason'),effectiveDate:val('effectiveDate'),regulationType:val('regulationType'),transition:val('transition'),review:null},'문서 입력사항 갱신');notify('문서 정보를 저장했습니다. 점검은 다시 실행해 주세요.');return;}
  if(form.id==='aiForm'){
    if(!d.has('consent')){notify('AI 원문 전송 동의를 확인하세요.');return;}
    if(aiWorking)return;aiWorking=true;aiMessage='AI 서버 연결을 확인하고 있습니다.';render();
    try{const reply=await fetch('./api/assist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation:work.type==='enact'?'enact':'amend',title:work.title,regulationType:work.regulationType,instruction:val('instruction'),baseText:work.baseText,draftText:work.draftText,sources:work.sources.filter(x=>!x.private)}),signal:AbortSignal.timeout(90000)});if(!reply.ok){const msg=await reply.json().catch(()=>({error:`HTTP ${reply.status}`}));throw new Error(msg.error||'AI 서버가 응답하지 않습니다.');}const json=await reply.json();if(!json.proposalText?.trim())throw new Error('AI가 수정된 초안을 반환하지 않았습니다.');aiMessage='제안을 받았습니다. 검토 후 직접 적용해야 합니다.';editWork({aiSuggestion:json},'AI 제안 수신');}
    catch(err){aiMessage=`AI 기능을 사용할 수 없습니다: ${err.message}. 직접 편집 기능은 계속 이용할 수 있습니다.`;notify('AI 서버가 연결되지 않았습니다.');}
    finally{aiWorking=false;render();}
  }
});
render();

</script></body>
